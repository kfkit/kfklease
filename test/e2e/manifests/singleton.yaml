# The test workload: the heartbeat example, which writes a record tagged
# with the lease epoch five times a second while the local scaler believes
# it holds the lease. KEDA owns its replica count through the chart's
# ScaledObject: 1 while this cluster holds the lease, 0 otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleton
spec:
  replicas: 0
  selector:
    matchLabels:
      app: singleton
  template:
    metadata:
      labels:
        app: singleton
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: singleton
          image: kfklease-heartbeat:dev
          imagePullPolicy: Never
          args: ["beat"]
          env:
            - name: CLUSTER
              value: ${CLUSTER}
            - name: HEARTBEAT_BROKERS
              value: 172.30.0.10:9092
            - name: KFKLEASE_STATUS_URL
              value: http://kfklease:9091/status
