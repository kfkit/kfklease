# Installed by the k3s helm-controller on cluster start.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: keda
  namespace: kube-system
spec:
  repo: https://kedacore.github.io/charts
  chart: keda
  version: 2.20.2
  targetNamespace: keda
  createNamespace: true
  valuesContent: |-
    # cache-images.sh puts the images into the node before the chart is
    # applied; the chart's default of Always would still ask the registry.
    image:
      pullPolicy: IfNotPresent
