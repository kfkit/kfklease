# One lease participant per cluster and the workload that follows the lease.
# Applied by ./deploy.sh <cluster>, which fills in CLUSTER.
apiVersion: v1
kind: Namespace
metadata:
  name: kfklease
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kfklease-scaler
  namespace: kfklease
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kfklease-scaler
  template:
    metadata:
      labels:
        app: kfklease-scaler
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: scaler
          image: kfklease-scaler:dev
          imagePullPolicy: Never
          env:
            - name: KFKLEASE_BROKERS
              value: 172.30.0.10:9092
            - name: KFKLEASE_TOPIC
              value: kfklease-e2e
            - name: KFKLEASE_TTL
              value: 10s
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Unique per process incarnation: the pod name changes on every
            # restart of the deployment, and a container restart within the
            # pod gets a new random suffix from the library. Both work.
            - name: KFKLEASE_HOLDER
              value: ${CLUSTER}/$(POD_NAME)
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 9090
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kfklease-scaler
  namespace: kfklease
spec:
  selector:
    app: kfklease-scaler
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
---
# The workload. KEDA owns its replica count: 1 while this cluster holds the
# lease, 0 otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleton
  namespace: kfklease
spec:
  replicas: 0
  selector:
    matchLabels:
      app: singleton
  template:
    metadata:
      labels:
        app: singleton
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: singleton
          image: busybox:1.37
          command: ["sh", "-c", "echo running on ${CLUSTER}; exec sleep infinity"]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: singleton
  namespace: kfklease
spec:
  scaleTargetRef:
    name: singleton
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 5
  # Scale to zero as soon as the lease is gone: every second of cooldown is
  # a second the old and the new holder may overlap.
  cooldownPeriod: 0
  triggers:
    - type: external-push
      metadata:
        scalerAddress: kfklease-scaler.kfklease.svc:9090
        topic: kfklease-e2e
