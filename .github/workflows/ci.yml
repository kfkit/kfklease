name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - name: generated code is up to date
        run: |
          make generate
          git diff --exit-code -- internal/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make integration

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make image

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make chart-test

  # The two-cluster stand: k3s + KEDA twice and a Kafka broker, then the
  # failover scenarios. Slow, so it runs after the fast jobs pass.
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, integration, image, chart]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
      - if: failure()
        run: test/e2e/diagnose.sh
      - if: always()
        run: make e2e-down
