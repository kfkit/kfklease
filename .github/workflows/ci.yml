name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test -race -count=1 ./...
      - name: generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make integration

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t kfklease-scaler:dev .

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: helm lint charts/kfklease --set site=s --set brokers=k:9092 --set topic=t --set scaledObject.targetRef.name=w
      - run: helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t --set scaledObject.targetRef.name=w > /dev/null
      - name: N replicas of any scalable kind; the old value fails loudly
        run: |
          out=$(helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t \
            --set scaledObject.targetRef.apiVersion=kafka.strimzi.io/v1beta2 \
            --set scaledObject.targetRef.kind=KafkaConnect --set scaledObject.targetRef.name=c \
            --set scaledObject.replicas=3 -s templates/scaledobject.yaml)
          echo "$out"
          for want in 'apiVersion: kafka.strimzi.io/v1beta2' 'kind: KafkaConnect' 'idleReplicaCount: 0' \
                      'minReplicaCount: 3' 'maxReplicaCount: 3'; do
            grep -qF "$want" <<<"$out" || { echo "missing: $want"; exit 1; }
          done
          for bad in 'scaledObject.target=w' 'scaledObject.targetRef.name=w,scaledObject.replicas=0'; do
            if helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t --set "$bad" >/dev/null; then
              echo "rendered with $bad"; exit 1
            fi
          done
      - name: Fail closed by default, a fallback to zero replicas
        run: |
          so() { helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t \
                   --set scaledObject.targetRef.name=w "$@" -s templates/scaledobject.yaml; }
          out=$(so)
          echo "$out"
          grep -A2 '^  fallback:' <<<"$out" | grep -qx '    replicas: 0' || { echo "no fallback to 0 replicas"; exit 1; }
          if so --set scaledObject.fallback.enabled=false | grep -q 'fallback:'; then
            echo "fallback rendered although disabled"; exit 1
          fi
      - name: Health gate off by default, wired when a URL is set
        run: |
          dep() { helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t \
                    --set scaledObject.targetRef.name=w "$@" -s templates/deployment.yaml; }
          if dep | grep -q KFKLEASE_HEALTH_; then
            echo "health gate rendered without a URL"; exit 1
          fi
          out=$(dep --set healthGate.url=http://c:8083/health --set healthGate.failAfter=2m)
          echo "$out"
          for name in URL INTERVAL TIMEOUT FAIL_AFTER COOLDOWN; do
            grep -qF "name: KFKLEASE_HEALTH_$name" <<<"$out" || { echo "missing: KFKLEASE_HEALTH_$name"; exit 1; }
          done
          grep -A1 'name: KFKLEASE_HEALTH_FAIL_AFTER' <<<"$out" | grep -qF 'value: "2m"' || { echo "failAfter not passed"; exit 1; }
      - name: Topic settings for a lease log, three replicas by default
        run: |
          dep() { helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t \
                    --set scaledObject.targetRef.name=w "$@" -s templates/deployment.yaml; }
          val() { grep -A1 "name: $1\$" <<<"$out" | grep -qF "value: \"$2\"" || { echo "$1 is not $2"; exit 1; }; }
          out=$(dep)
          val KFKLEASE_REPLICATION_FACTOR 3; val KFKLEASE_MIN_INSYNC_REPLICAS 0; val KFKLEASE_FLUSH_EVERY_RECORD false
          out=$(dep --set replicationFactor=1 --set minInsyncReplicas=1 --set flushEveryRecord=true)
          echo "$out"
          val KFKLEASE_REPLICATION_FACTOR 1; val KFKLEASE_MIN_INSYNC_REPLICAS 1; val KFKLEASE_FLUSH_EVERY_RECORD true
      - name: Pod settings render where Kubernetes reads them
        run: |
          dep() { helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t \
                    --set scaledObject.targetRef.name=w "$@" -s templates/deployment.yaml; }
          for bad in imagePullSecrets priorityClassName securityContext; do
            if dep | grep -q "$bad"; then echo "$bad rendered by default"; exit 1; fi
          done
          out=$(dep --set 'imagePullSecrets[0].name=regcred' --set priorityClassName=critical \
                    --set podLabels.team=data --set podSecurityContext.runAsNonRoot=true \
                    --set securityContext.readOnlyRootFilesystem=true)
          echo "$out"
          sel=$(sed -n '/^  selector:/,/^  template:/p' <<<"$out")
          grep -q 'team: data' <<<"$sel" && { echo "podLabels leaked into the selector"; exit 1; }
          for want in '      imagePullSecrets:' '        - name: regcred' '      priorityClassName: critical' \
                      '        team: data' '      securityContext:' '        runAsNonRoot: true' \
                      '          securityContext:' '            readOnlyRootFilesystem: true'; do
            grep -qxF "$want" <<<"$out" || { echo "missing: $want"; exit 1; }
          done
      - name: The lease belongs to a site, with a takeover delay that covers KEDA's cooldown
        run: |
          t() { helm template t charts/kfklease --set brokers=k:9092 --set topic=t \
                  --set scaledObject.targetRef.name=w "$@"; }
          val() { grep -A1 "name: $1\$" <<<"$out" | grep -qF "value: \"$2\"" || { echo "$1 is not $2"; exit 1; }; }
          out=$(t --set site=eu-west)
          echo "$out"
          val KFKLEASE_SITE eu-west; val KFKLEASE_HOLDER 'eu-west/$(POD_NAME)'
          # 5 s polling + 60 s cooldown + 30 s margin.
          val KFKLEASE_TAKEOVER_DELAY 95s
          grep -qx '  cooldownPeriod: 60' <<<"$out" || { echo "cooldownPeriod is not 60"; exit 1; }
          out=$(t --set site=eu --set takeoverDelay=120); val KFKLEASE_TAKEOVER_DELAY 120s
          # The slowest ScaledObject of the release sets the bound.
          out=$(t --set site=eu --set 'extraLeases[0].topic=b' --set 'extraLeases[0].scaledObject.targetRef.name=wb' \
                  --set 'extraLeases[0].scaledObject.cooldownPeriod=100')
          val KFKLEASE_TAKEOVER_DELAY 135s
          for bad in '' 'site=eu,holderPrefix=eu' 'site=eu,takeoverDelay=94' 'site=eu,takeoverDelay=-1'; do
            if err=$(t ${bad:+--set "$bad"} 2>&1 >/dev/null); then
              echo "rendered with '$bad'"; exit 1
            fi
            echo "'$bad': $err"
          done
          grep -q 'replaced by site' <<<"$(t --set holderPrefix=eu --set site=eu 2>&1)" || { echo "holderPrefix error does not name site"; exit 1; }
      - name: Standby mode off by default
        run: |
          dep() { helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=t \
                    --set scaledObject.targetRef.name=w "$@" -s templates/deployment.yaml; }
          val() { grep -A1 "name: $1\$" <<<"$out" | grep -qF "value: \"$2\"" || { echo "$1 is not $2"; exit 1; }; }
          out=$(dep); val KFKLEASE_STANDBY false
          out=$(dep --set standby=true); val KFKLEASE_STANDBY true
      - name: Several leases in one release, one ScaledObject each
        run: |
          t() { helm template t charts/kfklease --set site=s --set brokers=k:9092 --set topic=a \
                  --set scaledObject.targetRef.name=wa --set scaledObject.cooldownPeriod=7 "$@"; }
          out=$(t --set 'extraLeases[0].topic=b' --set 'extraLeases[0].scaledObject.targetRef.name=wb' \
                  --set 'extraLeases[0].scaledObject.targetRef.kind=KafkaConnect' \
                  --set 'extraLeases[0].scaledObject.targetRef.apiVersion=kafka.strimzi.io/v1beta2' \
                  --set 'extraLeases[0].scaledObject.replicas=3' --set 'extraLeases[0].healthGate.url=http://b:8083/' \
                  --set 'extraLeases[1].topic=c' --set 'extraLeases[1].scaledObject.targetRef.name=wc')
          echo "$out"
          [ "$(grep -c '^kind: ScaledObject' <<<"$out")" = 3 ] || { echo "want 3 ScaledObjects"; exit 1; }
          [ "$(grep -c '^  cooldownPeriod: 7' <<<"$out")" = 3 ] || { echo "top-level scaledObject not inherited"; exit 1; }
          for want in 'value: "a,b,c"' 'value: ",http://b:8083/,"' 'topic: "b"' 'kind: KafkaConnect' 'minReplicaCount: 3'; do
            grep -qF "$want" <<<"$out" || { echo "missing: $want"; exit 1; }
          done
          for bad in 'extraLeases[0].topic=a,extraLeases[0].scaledObject.targetRef.name=x' \
                     'extraLeases[0].topic=b,extraLeases[0].scaledObject.targetRef.name=wa' \
                     'extraLeases[0].topic=b' 'extraLeases[0].scaledObject.targetRef.name=x' 'topic=a\,b'; do
            if t --set "$bad" >/dev/null; then
              echo "rendered with $bad"; exit 1
            fi
          done

  # The two-cluster stand: k3s + KEDA twice and a Kafka broker, then the
  # failover scenarios. Slow, so it runs after the fast jobs pass.
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, integration, image, chart]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: test/e2e/build-image.sh
      - run: test/e2e/smoke.sh
      - run: test/e2e/deploy.sh k3s-a && test/e2e/deploy.sh k3s-b
      - run: test/e2e/scenarios.sh
      - if: failure()
        run: |
          docker compose -f test/e2e/compose.yaml ps -a
          for c in k3s-a k3s-b; do
            kubectl --kubeconfig test/e2e/.out/$c/kubeconfig.yaml -n kfklease get pods,scaledobject || true
            kubectl --kubeconfig test/e2e/.out/$c/kubeconfig.yaml -n kfklease logs deploy/kfklease --tail=50 || true
            kubectl --kubeconfig test/e2e/.out/$c/kubeconfig.yaml -n keda logs deploy/keda-operator --tail=30 || true
          done
      - if: always()
        run: docker compose -f test/e2e/compose.yaml down -v
