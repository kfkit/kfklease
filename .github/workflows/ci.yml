name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Does the pull request touch more than documents? If not, the jobs below
  # that build and run the code are skipped, and a skipped job passes as a
  # required check. A push to main always runs them all, and so does a
  # change this job could not judge (the conditions read "not false").
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        run: test/changes.sh | tee -a "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - name: generated code is up to date
        run: |
          make generate
          git diff --exit-code -- internal/

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make integration

  image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make image

  chart:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make chart-test

  # The two-cluster stand: k3s + KEDA twice and a Kafka broker, then the
  # failover scenarios. Slow, so it runs after the fast jobs pass.
  e2e:
    runs-on: ubuntu-latest
    needs: [changes, unit, integration, image, chart]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false'
      && needs.unit.result == 'success' && needs.integration.result == 'success'
      && needs.image.result == 'success' && needs.chart.result == 'success' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
      - if: failure()
        run: test/e2e/diagnose.sh
      - if: always()
        run: make e2e-down
