# On a version tag: multi-arch image and Helm chart to GHCR, the image
# signed with cosign (keyless, GitHub OIDC), and a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the release
  packages: write   # GHCR
  id-token: write   # cosign keyless signing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kfklease-scaler
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - uses: sigstore/cosign-installer@v3
      - name: sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: package and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          helm package charts/kfklease --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "kfklease-${version}.tgz" "$CHARTS"

  release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `${{ env.IMAGE }}:${{ github.ref_name }}` (linux/amd64, linux/arm64), digest `${{ needs.image.outputs.digest }}`, signed with cosign:

                cosign verify ${{ env.IMAGE }}@${{ needs.image.outputs.digest }} \
                  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com

            Chart: `helm install kfklease ${{ env.CHARTS }}/kfklease --version ${{ github.ref_name }}` (strip the `v`).
