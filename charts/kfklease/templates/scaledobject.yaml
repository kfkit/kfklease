{{- /* One ScaledObject per lease: the release's own (topic, scaledObject,
healthGate.url) and every entry of extraLeases, whose scaledObject is
merged over the top-level one. */ -}}
{{- range $i, $l := include "kfklease.leases" . | fromYamlArray }}
{{- $so := $l.scaledObject }}
{{- if $so.enabled }}
{{- $replicas := int $so.replicas }}
{{- if lt $replicas 1 }}{{ fail (printf "%sscaledObject.replicas must be at least 1" $l.pfx) }}{{ end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $so.targetRef.name }}
  labels:
    {{- include "kfklease.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ $so.targetRef.apiVersion }}
    kind: {{ $so.targetRef.kind }}
    name: {{ $so.targetRef.name }}
  # Inactive: KEDA scales the target to idleReplicaCount. Active: the HPA
  # keeps it between min and max, which are the same. The scaler's metric
  # (1 of a target of 1) never asks for more than min.
  idleReplicaCount: 0
  minReplicaCount: {{ $replicas }}
  maxReplicaCount: {{ $replicas }}
  pollingInterval: {{ $so.pollingInterval }}
  cooldownPeriod: {{ $so.cooldownPeriod }}
  {{- if $so.fallback.enabled }}
  # Fail closed when KEDA cannot ask the scaler (pod gone, Pending, not
  # ready): with replicas 0, a scaler error scales the target to
  # idleReplicaCount once cooldownPeriod has passed since the last active
  # answer, instead of leaving it running while another cluster takes the
  # lease. failureThreshold only counts on the HPA's metric path, which
  # idle mode bypasses; KEDA requires it.
  fallback:
    failureThreshold: 3
    replicas: 0
  {{- end }}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: {{ printf "%s.%s.svc:%d" (include "kfklease.name" $) $.Release.Namespace (int $.Values.service.port) | quote }}
        # The lease of this workload, among those the scaler serves.
        topic: {{ $l.topic | quote }}
{{- end }}
{{- end }}
