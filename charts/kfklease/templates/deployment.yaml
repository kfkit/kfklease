{{- if hasKey .Values "holderPrefix" }}{{ fail "holderPrefix was replaced by site: set site to this cluster's name; holder ids are <site>/<pod name>" }}{{ end }}
{{- if not .Values.site }}{{ fail "site is required: name this cluster, e.g. --set site=eu-west" }}{{ end }}
{{- if not .Values.brokers }}{{ fail "brokers is required" }}{{ end }}
{{- if not .Values.topic }}{{ fail "topic is required" }}{{ end }}
{{- $tls := .Values.auth.tls -}}
{{- $sasl := .Values.auth.sasl -}}
{{- $leases := include "kfklease.leases" . | fromYamlArray -}}
{{- $topics := list -}}
{{- $urls := list -}}
{{- range $leases }}{{ $topics = append $topics .topic }}{{ $urls = append $urls .healthUrl }}{{ end -}}
{{- /* The takeover delay covers the slowest ScaledObject of the release:
its KEDA polling, its cooldown and the workload's stop. */ -}}
{{- $bound := 0 -}}
{{- range $leases }}{{ $b := add (int .scaledObject.pollingInterval) (int .scaledObject.cooldownPeriod) (int $.Values.takeoverMargin) }}{{ if gt (int $b) $bound }}{{ $bound = int $b }}{{ end }}{{ end -}}
{{- $delay := int .Values.takeoverDelay -}}
{{- if lt $delay 0 }}{{ fail "takeoverDelay must not be negative" }}{{ end -}}
{{- if eq $delay 0 }}{{ $delay = $bound }}{{ end -}}
{{- if lt $delay $bound }}{{ fail (printf "takeoverDelay %d is below pollingInterval + cooldownPeriod + takeoverMargin = %d: another site would start the workload before this one has stopped it" $delay $bound) }}{{ end -}}
{{- if and $tls.enabled $tls.clientCert (not $tls.secretName) }}{{ fail "auth.tls.clientCert needs auth.tls.secretName" }}{{ end }}
{{- if and $sasl.mechanism (not $sasl.secretName) }}{{ fail "auth.sasl.mechanism needs auth.sasl.secretName" }}{{ end }}
{{- if lt (int .Values.replicaCount) 1 }}{{ fail "replicaCount must be at least 1" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kfklease.name" . }}
  labels:
    {{- include "kfklease.labels" . | nindent 4 }}
spec:
  # Every pod takes part in the lease for the site and answers KEDA for it:
  # one holds and renews, the others read its term from the log and take
  # over at once when it ends. Losing one pod neither blinds KEDA nor moves
  # the workload. A rolling update starts a new pod before it stops an old
  # one, and waits until the new one knows the lease state (readiness).
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "kfklease.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kfklease.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations .Values.metrics.podAnnotations }}
      annotations:
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.httpPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      # Long enough to write the release on shutdown.
      terminationGracePeriodSeconds: 15
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scaler
          image: {{ include "kfklease.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KFKLEASE_BROKERS
              value: {{ .Values.brokers | quote }}
            # One lease per topic, comma-separated.
            - name: KFKLEASE_TOPIC
              value: {{ join "," $topics | quote }}
            - name: KFKLEASE_TTL
              value: {{ .Values.ttl | quote }}
            {{- with .Values.margin }}
            - name: KFKLEASE_MARGIN
              value: {{ . | quote }}
            {{- end }}
            - name: KFKLEASE_CREATE_TOPIC
              value: {{ .Values.createTopic | quote }}
            - name: KFKLEASE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}
            - name: KFKLEASE_MIN_INSYNC_REPLICAS
              value: {{ .Values.minInsyncReplicas | quote }}
            - name: KFKLEASE_FLUSH_EVERY_RECORD
              value: {{ .Values.flushEveryRecord | quote }}
            - name: KFKLEASE_LISTEN
              value: {{ printf ":%d" (int .Values.service.port) | quote }}
            - name: KFKLEASE_HTTP_LISTEN
              value: {{ printf ":%d" (int .Values.service.httpPort) | quote }}
            - name: KFKLEASE_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.healthGate }}
            {{- if compact $urls }}
            # One per topic, in the same order; empty: no gate for that lease.
            - name: KFKLEASE_HEALTH_URL
              value: {{ join "," $urls | quote }}
            - name: KFKLEASE_HEALTH_INTERVAL
              value: {{ .interval | quote }}
            - name: KFKLEASE_HEALTH_TIMEOUT
              value: {{ .timeout | quote }}
            - name: KFKLEASE_HEALTH_FAIL_AFTER
              value: {{ .failAfter | quote }}
            - name: KFKLEASE_HEALTH_COOLDOWN
              value: {{ .cooldown | quote }}
            {{- end }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The lease belongs to the site; the holder id is unique per
            # process incarnation: a new pod gets a new name.
            - name: KFKLEASE_SITE
              value: {{ .Values.site | quote }}
            - name: KFKLEASE_HOLDER
              value: {{ printf "%s/$(POD_NAME)" .Values.site | quote }}
            - name: KFKLEASE_TAKEOVER_DELAY
              value: {{ printf "%ds" $delay | quote }}
            - name: KFKLEASE_STANDBY
              value: {{ .Values.standby | quote }}
            {{- if $tls.enabled }}
            - name: KFKLEASE_TLS
              value: "true"
            {{- if $tls.secretName }}
            # Certificates are mounted as files and re-read on every
            # connection, so a renewed Secret needs no restart.
            - name: KFKLEASE_TLS_CA_FILE
              value: /etc/kfklease/tls/{{ $tls.caKey }}
            {{- if $tls.clientCert }}
            - name: KFKLEASE_TLS_CERT_FILE
              value: /etc/kfklease/tls/{{ $tls.certKey }}
            - name: KFKLEASE_TLS_KEY_FILE
              value: /etc/kfklease/tls/{{ $tls.keyKey }}
            {{- end }}
            {{- end }}
            {{- with $tls.serverName }}
            - name: KFKLEASE_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if $tls.insecureSkipVerify }}
            - name: KFKLEASE_TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- end }}
            {{- if $sasl.mechanism }}
            # Credentials come in as environment variables straight from the
            # Secret. A pod reads its environment once: restart it when the
            # Secret changes (see podAnnotations).
            - name: KFKLEASE_SASL_MECHANISM
              value: {{ $sasl.mechanism | quote }}
            {{- if $sasl.usernameKey }}
            - name: KFKLEASE_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $sasl.secretName }}
                  key: {{ $sasl.usernameKey }}
            {{- else if $sasl.username }}
            - name: KFKLEASE_SASL_USERNAME
              value: {{ $sasl.username | quote }}
            {{- end }}
            {{- if eq $sasl.mechanism "oauthbearer" }}
            - name: KFKLEASE_SASL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sasl.secretName }}
                  key: {{ $sasl.tokenKey }}
            {{- else }}
            - name: KFKLEASE_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $sasl.secretName }}
                  key: {{ $sasl.passwordKey }}
            {{- end }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          # Ready once the scaler knows the state of every lease it serves;
          # until then it would answer KEDA with an error.
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
              service: ready
            periodSeconds: 2
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and $tls.enabled $tls.secretName }}
          volumeMounts:
            - name: tls
              mountPath: /etc/kfklease/tls
              readOnly: true
          {{- end }}
      {{- if and $tls.enabled $tls.secretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ $tls.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        # The replicas on different nodes where there are several: a lost
        # node then takes one of them, not all.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "kfklease.selectorLabels" . | nindent 20 }}
        {{- end }}
