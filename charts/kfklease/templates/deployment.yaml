{{- if not .Values.brokers }}{{ fail "brokers is required" }}{{ end }}
{{- if not .Values.topic }}{{ fail "topic is required" }}{{ end }}
{{- $tls := .Values.auth.tls -}}
{{- $sasl := .Values.auth.sasl -}}
{{- if and $tls.enabled $tls.clientCert (not $tls.secretName) }}{{ fail "auth.tls.clientCert needs auth.tls.secretName" }}{{ end }}
{{- if and $sasl.mechanism (not $sasl.secretName) }}{{ fail "auth.sasl.mechanism needs auth.sasl.secretName" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kfklease.name" . }}
  labels:
    {{- include "kfklease.labels" . | nindent 4 }}
spec:
  # One participant per cluster. Recreate, not RollingUpdate: two pods of
  # the same release would be two candidates for the same lease.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kfklease.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kfklease.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.metrics.podAnnotations }}
      annotations:
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.httpPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      # Long enough to write the release on shutdown.
      terminationGracePeriodSeconds: 15
      containers:
        - name: scaler
          image: {{ include "kfklease.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KFKLEASE_BROKERS
              value: {{ .Values.brokers | quote }}
            - name: KFKLEASE_TOPIC
              value: {{ .Values.topic | quote }}
            - name: KFKLEASE_TTL
              value: {{ .Values.ttl | quote }}
            {{- with .Values.margin }}
            - name: KFKLEASE_MARGIN
              value: {{ . | quote }}
            {{- end }}
            - name: KFKLEASE_CREATE_TOPIC
              value: {{ .Values.createTopic | quote }}
            - name: KFKLEASE_LISTEN
              value: {{ printf ":%d" (int .Values.service.port) | quote }}
            - name: KFKLEASE_HTTP_LISTEN
              value: {{ printf ":%d" (int .Values.service.httpPort) | quote }}
            - name: KFKLEASE_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Unique per process incarnation: a new pod gets a new name.
            - name: KFKLEASE_HOLDER
              value: {{ printf "%s/$(POD_NAME)" (.Values.holderPrefix | default .Release.Name) | quote }}
            {{- if $tls.enabled }}
            - name: KFKLEASE_TLS
              value: "true"
            {{- if $tls.secretName }}
            # Certificates are mounted as files and re-read on every
            # connection, so a renewed Secret needs no restart.
            - name: KFKLEASE_TLS_CA_FILE
              value: /etc/kfklease/tls/{{ $tls.caKey }}
            {{- if $tls.clientCert }}
            - name: KFKLEASE_TLS_CERT_FILE
              value: /etc/kfklease/tls/{{ $tls.certKey }}
            - name: KFKLEASE_TLS_KEY_FILE
              value: /etc/kfklease/tls/{{ $tls.keyKey }}
            {{- end }}
            {{- end }}
            {{- with $tls.serverName }}
            - name: KFKLEASE_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if $tls.insecureSkipVerify }}
            - name: KFKLEASE_TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- end }}
            {{- if $sasl.mechanism }}
            # Credentials come in as environment variables straight from the
            # Secret. A pod reads its environment once: restart it when the
            # Secret changes (see podAnnotations).
            - name: KFKLEASE_SASL_MECHANISM
              value: {{ $sasl.mechanism | quote }}
            {{- if $sasl.usernameKey }}
            - name: KFKLEASE_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $sasl.secretName }}
                  key: {{ $sasl.usernameKey }}
            {{- else if $sasl.username }}
            - name: KFKLEASE_SASL_USERNAME
              value: {{ $sasl.username | quote }}
            {{- end }}
            {{- if eq $sasl.mechanism "oauthbearer" }}
            - name: KFKLEASE_SASL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sasl.secretName }}
                  key: {{ $sasl.tokenKey }}
            {{- else }}
            - name: KFKLEASE_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $sasl.secretName }}
                  key: {{ $sasl.passwordKey }}
            {{- end }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and $tls.enabled $tls.secretName }}
          volumeMounts:
            - name: tls
              mountPath: /etc/kfklease/tls
              readOnly: true
          {{- end }}
      {{- if and $tls.enabled $tls.secretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ $tls.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
