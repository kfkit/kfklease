# Default values for kfklease.

image:
  repository: ghcr.io/kfkit/kfklease-scaler
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# The lease. brokers and topic are required.
brokers: ""          # comma-separated bootstrap addresses
topic: ""            # one lease per topic; more with extraLeases
ttl: 10s             # the same for every participant of the lease
margin: ""           # empty for ttl/5
createTopic: true    # create the topic with the settings the protocol needs

# How createTopic creates the topic. An existing topic is never altered; the
# scaler checks it at start and logs a warning for each setting that falls
# short of these.
replicationFactor: 3     # needs as many brokers; never lowered to fit
minInsyncReplicas: 0     # 0: 2 with three or more replicas, otherwise 1
# flush.messages=1: every record is fsynced before it is acknowledged, which
# protects the tail of the log when all replicas go down at once. Costs a
# little renewal latency; the Kafka documentation relies on replication.
flushEveryRecord: false

# Required: where this release runs, one name per cluster (eu-west, say).
# The lease belongs to the site, not to the scaler pod: holder ids are
# "<site>/<pod name>", and a restarted scaler claims for its site at once,
# so the workload stays where it is.
site: ""

# How long a cluster waits, after another site's term ended (by expiry or
# release), before it claims: the time that site's KEDA needs to scale its
# workload down (pollingInterval + cooldownPeriod) and the workload needs
# to stop (takeoverMargin). In seconds; 0 derives it from the slowest
# ScaledObject of the release, and a value below that is refused. The
# order that keeps a workload in one place: a scaler restart < cooldownPeriod
# < takeoverDelay.
takeoverDelay: 0
takeoverMargin: 30   # seconds; cover the workload's terminationGracePeriodSeconds

# Standby mode: this cluster follows the leases and never claims them, so
# its workload stays at zero. For maintenance, or to move the workload to
# another cluster on purpose: setting it on the holding cluster restarts the
# scaler, whose pod releases on its way out, and another cluster takes over
# after its takeoverDelay. Set it back to false to let the cluster claim
# again; nothing moves back on its own.
standby: false

logLevel: info

# Scaler pods per cluster. Every one takes part in the lease for the site
# and answers KEDA for it: one holds the term and renews it, the others read
# it from the log and say "my site holds" while the term is valid, and take
# over at once when it ends. Losing one pod (a node, an eviction, an image
# that does not pull in an upgrade) then neither blinds KEDA nor moves the
# workload. Spread over nodes by default (affinity); 1 is the old single pod.
replicaCount: 2
# Keeps a voluntary disruption (a drain) from taking every scaler pod of the
# cluster at once. Rendered only with more than one replica.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional: give the lease up when the workload cannot run here. While this
# cluster holds the lease, the scaler GETs url every interval (200-399 is
# healthy). When no probe has passed for failAfter, counted from the start
# of the term, it releases the lease, so another cluster takes over at once,
# and claims nothing for cooldown. failAfter is also the time the workload
# gets to come up after a failover: leave it room. Empty url: off.
healthGate:
  url: ""            # e.g. http://my-connect-connect-api:8083/health
  interval: 10s
  timeout: 5s
  failAfter: 5m
  cooldown: 10m

# Authentication to the brokers. The chart holds no secret itself: it points
# at Kubernetes Secrets, whoever creates them (cert-manager, Strimzi,
# External Secrets, kubectl).
auth:
  # Certificates are mounted from the Secret as files, the usual way, and
  # re-read on every connection: a renewed certificate needs no restart.
  tls:
    enabled: false
    secretName: ""     # holds the CA and, for mTLS, the client certificate
    caKey: ca.crt
    clientCert: false  # mTLS with certKey and keyKey from the same Secret
    certKey: tls.crt   # kubernetes.io/tls layout; Strimzi: user.crt
    keyKey: tls.key    #                           Strimzi: user.key
    serverName: ""     # when brokers are advertised by IP
    insecureSkipVerify: false
  # Credentials go in as environment variables from the Secret. A pod reads
  # its environment once, so restart it when the Secret changes: with
  # stakater/reloader, set podAnnotations to reloader.stakater.com/auto: "true".
  sasl:
    mechanism: ""      # plain, scram-sha-256, scram-sha-512, oauthbearer
    secretName: ""
    username: ""       # or usernameKey when the Secret holds it too
    usernameKey: ""
    passwordKey: password   # plain, scram; Strimzi's KafkaUser layout
    tokenKey: token         # oauthbearer

podAnnotations: {}
# Extra labels on the scaler pod, next to the chart's own.
podLabels: {}

# The image is pulled with these, e.g. [{name: regcred}].
imagePullSecrets: []
priorityClassName: ""
# The pod's and the container's securityContext. The image runs as
# nonroot (65532) and needs no writable filesystem, so the restricted Pod
# Security Standard fits, e.g.:
#   podSecurityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
#   securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
#                     capabilities: {drop: [ALL]}}
podSecurityContext: {}
securityContext: {}

# A ScaledObject that keeps a workload at `replicas` while this cluster
# holds the lease and at zero otherwise. Disable it to write your own.
scaledObject:
  enabled: true
  # What to scale, in the release namespace: anything with a scale
  # subresource. name is required.
  targetRef:
    apiVersion: apps/v1
    kind: Deployment   # or StatefulSet, or a custom resource such as
                       # Strimzi's KafkaConnect (kafka.strimzi.io/v1beta2)
    name: ""
  # Replicas while this cluster holds the lease.
  replicas: 1
  pollingInterval: 5
  # How long KEDA keeps the workload after the scaler stopped saying
  # "holding" or could not be asked: longer than a scaler restart, so that
  # a restart leaves the workload alone. Another site waits for it through
  # takeoverDelay before it starts its own.
  cooldownPeriod: 60
  # Scale the target to zero when KEDA cannot reach the scaler (its pod
  # lost, Pending, not ready), rather than leave it running while the term
  # runs out and another cluster starts it too. Renders KEDA's fallback
  # with replicas 0; false keeps the replicas as they are on a scaler error.
  fallback:
    enabled: true

# More leases served by the same scaler, one per topic, each with its own
# workload. Every entry takes part in its own lease and gets its own
# ScaledObject; its scaledObject is merged over the one above, so only what
# differs needs saying. ttl, margin, site, takeoverDelay, auth and the healthGate
# timings are shared; healthGate.url is per lease, empty for no gate.
#
# extraLeases:
#   - topic: mm2-eu-us
#     scaledObject:
#       targetRef:
#         apiVersion: kafka.strimzi.io/v1beta2
#         kind: KafkaMirrorMaker2
#         name: eu-us
#       replicas: 3
#     healthGate:
#       url: http://eu-us-mirrormaker2-api:8083/
extraLeases: []

service:
  port: 9090
  # /metrics, /status and /healthz.
  httpPort: 9091

metrics:
  # prometheus.io/* annotations on the pod, for scrapers that use them.
  podAnnotations: true
  # A ServiceMonitor for the Prometheus Operator.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
# Empty: a preferred anti-affinity that spreads the scaler pods over nodes.
affinity: {}
