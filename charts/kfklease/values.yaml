# Default values for kfklease.

image:
  repository: ghcr.io/kfkit/kfklease-scaler
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# The lease. brokers and topic are required.
brokers: ""          # comma-separated bootstrap addresses
topic: ""            # one lease per topic
ttl: 10s             # the same for every participant of the lease
margin: ""           # empty for ttl/5
createTopic: true    # create the topic with the settings the protocol needs

# Holder ids are "<holderPrefix>/<pod name>". Empty means the release name.
# Use something that names the cluster, so that logs and the lease topic
# say where the workload runs.
holderPrefix: ""

logLevel: info

# Authentication to the brokers. The chart holds no secret itself: it points
# at Kubernetes Secrets, whoever creates them (cert-manager, Strimzi,
# External Secrets, kubectl).
auth:
  # Certificates are mounted from the Secret as files, the usual way, and
  # re-read on every connection: a renewed certificate needs no restart.
  tls:
    enabled: false
    secretName: ""     # holds the CA and, for mTLS, the client certificate
    caKey: ca.crt
    clientCert: false  # mTLS with certKey and keyKey from the same Secret
    certKey: tls.crt   # kubernetes.io/tls layout; Strimzi: user.crt
    keyKey: tls.key    #                           Strimzi: user.key
    serverName: ""     # when brokers are advertised by IP
    insecureSkipVerify: false
  # Credentials go in as environment variables from the Secret. A pod reads
  # its environment once, so restart it when the Secret changes: with
  # stakater/reloader, set podAnnotations to reloader.stakater.com/auto: "true".
  sasl:
    mechanism: ""      # plain, scram-sha-256, scram-sha-512, oauthbearer
    secretName: ""
    username: ""       # or usernameKey when the Secret holds it too
    usernameKey: ""
    passwordKey: password   # plain, scram; Strimzi's KafkaUser layout
    tokenKey: token         # oauthbearer

podAnnotations: {}

# A ScaledObject that keeps a workload at one replica while this cluster
# holds the lease and at zero otherwise. Disable it to write your own.
scaledObject:
  enabled: true
  # The Deployment to scale, in the release namespace.
  target: ""
  pollingInterval: 5
  # Every second of cooldown is a second the old and the new holder may
  # overlap.
  cooldownPeriod: 0

service:
  port: 9090
  # /metrics, /status and /healthz.
  httpPort: 9091

metrics:
  # prometheus.io/* annotations on the pod, for scrapers that use them.
  podAnnotations: true
  # A ServiceMonitor for the Prometheus Operator.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
